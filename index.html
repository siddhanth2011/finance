<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FINVEST — Market Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─── */
:root{
  --bg:#06080c;
  --surface:#0b0e14;
  --surface2:#10141c;
  --surface3:#151b25;
  --border:#1c2330;
  --border2:#243040;
  --text:#e8edf5;
  --sub:#8898ae;
  --dim:#4a5568;
  --accent:#4af0c4;
  --accent-dim:rgba(74,240,196,.12);
  --accent-glow:rgba(74,240,196,.25);
  --green:#3dd68c;
  --green-dim:rgba(61,214,140,.12);
  --red:#f56565;
  --red-dim:rgba(245,101,101,.12);
  --amber:#f6ad55;
  --mono:'JetBrains Mono',monospace;
  --sans:'Syne',system-ui,sans-serif;
  --r-sm:8px;
  --r-md:12px;
  --r-lg:18px;
  --r-xl:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ─── LAYOUT ─── */
.shell{max-width:1600px;margin:auto;padding:0 24px}

/* ─── TOPBAR ─── */
.topbar{
  display:flex;align-items:center;gap:32px;
  padding:0 24px;height:68px;
  background:rgba(6,8,12,.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
  max-width:100%;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{
  width:34px;height:34px;border-radius:var(--r-sm);
  background:linear-gradient(135deg,#1a3a2e,#0d2419);
  border:1px solid rgba(74,240,196,.3);
  display:grid;place-items:center;
  font-family:var(--mono);font-size:14px;font-weight:600;
  color:var(--accent);letter-spacing:-.5px;
}
.brand-name{font-size:16px;font-weight:800;letter-spacing:.04em}
.brand-name span{color:var(--accent)}
.nav{display:flex;gap:4px;flex:1}
.nav-btn{
  padding:7px 14px;border-radius:var(--r-sm);
  font-size:13px;font-weight:600;color:var(--sub);
  transition:.15s;border:1px solid transparent;
}
.nav-btn:hover{color:var(--text);background:var(--surface2)}
.nav-btn.active{color:var(--text);background:var(--surface3);border-color:var(--border2)}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.currency-pill{
  display:flex;gap:2px;padding:4px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
}
.currency-btn{
  padding:6px 12px;border-radius:var(--r-sm);
  font-family:var(--mono);font-size:11px;font-weight:600;
  color:var(--sub);transition:.15s;
}
.currency-btn:hover{color:var(--text)}
.currency-btn.active{background:var(--surface3);color:var(--accent);border:1px solid rgba(74,240,196,.2)}
.credits-link{
  padding:7px 14px;border-radius:var(--r-sm);
  border:1px solid var(--border2);
  font-size:12px;font-weight:600;color:var(--sub);
  transition:.15s;
}
.credits-link:hover{color:var(--text);border-color:var(--border2);background:var(--surface2)}

/* ─── TICKER TAPE ─── */
.ticker-wrap{
  background:var(--surface);border-bottom:1px solid var(--border);
  overflow:hidden;height:36px;display:flex;align-items:center;
}
.ticker-inner{
  display:flex;gap:0;white-space:nowrap;
  animation:ticker 40s linear infinite;
}
.ticker-inner:hover{animation-play-state:paused}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.tick-item{
  display:inline-flex;align-items:center;gap:8px;
  padding:0 20px;font-family:var(--mono);font-size:11px;
  border-right:1px solid var(--border);
}
.tick-name{color:var(--sub);font-weight:600}
.tick-price{color:var(--text);font-weight:500}
.tick-chg.pos{color:var(--green)}
.tick-chg.neg{color:var(--red)}

/* ─── INDEX CARDS ─── */
.index-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:20px 24px 16px;max-width:1600px;margin:auto}
.idx-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;
}
.idx-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 60%,rgba(74,240,196,.04));
  opacity:0;transition:.2s;
}
.idx-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.idx-card:hover::before,.idx-card.active{opacity:1}
.idx-card.active{border-color:rgba(74,240,196,.35);background:linear-gradient(135deg,#0e1e19,#0b0e14)}
.idx-card.active::before{opacity:1}
.idx-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.idx-name{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.03em}
.idx-badge{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600}
.idx-badge.pos{background:var(--green-dim);color:var(--green)}
.idx-badge.neg{background:var(--red-dim);color:var(--red)}
.idx-value{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.5px;margin-bottom:4px}
.idx-change{font-family:var(--mono);font-size:11px}
.idx-change.pos{color:var(--green)}
.idx-change.neg{color:var(--red)}
.idx-spark{height:28px;margin-top:10px}
.idx-spark svg{width:100%;height:100%}

/* ─── MAIN GRID ─── */
.main-grid{display:grid;grid-template-columns:1fr 320px;gap:12px;padding:0 24px 24px;max-width:1600px;margin:auto}

/* ─── CHART PANEL ─── */
.chart-panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-xl);padding:24px;
}
.chart-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.chart-title-block{display:flex;flex-direction:column;gap:4px}
.chart-symbol{font-family:var(--mono);font-size:11px;color:var(--sub);font-weight:500}
.chart-name{font-size:22px;font-weight:800;letter-spacing:-.02em}
.live-dot{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:var(--accent);background:var(--accent-dim);padding:3px 8px;border-radius:20px;border:1px solid rgba(74,240,196,.2)}
.live-dot::before{content:'';width:5px;height:5px;background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.period-tabs{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px}
.period-btn{
  padding:5px 10px;border-radius:6px;
  font-family:var(--mono);font-size:10px;font-weight:600;
  color:var(--sub);transition:.15s;
}
.period-btn:hover{color:var(--text)}
.period-btn.active{background:var(--surface3);color:var(--accent);border:1px solid rgba(74,240,196,.2)}
.chart-metrics{display:flex;gap:24px;margin-bottom:16px;flex-wrap:wrap}
.metric{display:flex;flex-direction:column;gap:3px}
.metric-label{font-family:var(--mono);font-size:9px;color:var(--sub);letter-spacing:.08em;text-transform:uppercase}
.metric-value{font-family:var(--mono);font-size:16px;font-weight:600}
.metric-value.big{font-size:28px;letter-spacing:-.03em}
.metric-value.pos{color:var(--green)}
.metric-value.neg{color:var(--red)}
.chart-area{
  height:300px;background:linear-gradient(180deg,var(--surface2),var(--bg));
  border:1px solid var(--border);border-radius:var(--r-md);
  overflow:hidden;position:relative;margin-bottom:12px;
}
.chart-area svg{width:100%;height:100%;display:block}
.chart-watermark{
  position:absolute;bottom:10px;left:14px;
  font-family:var(--mono);font-size:9px;color:var(--dim);
}
.chart-footer{display:flex;justify-content:space-between;align-items:center}
.chart-update{font-family:var(--mono);font-size:9px;color:var(--dim)}
.chart-disclaimer{font-family:var(--mono);font-size:9px;color:var(--dim)}

/* ─── SIDE PANEL ─── */
.side-panel{display:flex;flex-direction:column;gap:12px}
.side-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-xl);padding:18px;
}
.side-card-title{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.side-card-count{font-family:var(--mono);font-size:10px;background:var(--surface2);border:1px solid var(--border);padding:2px 8px;border-radius:20px;color:var(--sub)}

/* search */
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 12px;margin-bottom:12px;
  transition:.15s;
}
.search-box:focus-within{border-color:rgba(74,240,196,.3)}
.search-icon{color:var(--sub);font-size:13px;flex-shrink:0}
.search-box input{flex:1;background:none;border:none;outline:none;font-size:12px;color:var(--text)}
.search-box input::placeholder{color:var(--dim)}

/* watchlist */
.watch-empty{font-size:11px;color:var(--dim);padding:8px 0;text-align:center}
.watch-row{
  display:flex;align-items:center;gap:8px;
  padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:.15s;
}
.watch-row:last-child{border-bottom:none}
.watch-row:hover{opacity:.8}
.star-btn{font-size:14px;color:var(--dim);transition:.15s;padding:2px;flex-shrink:0}
.star-btn:hover,.star-btn.on{color:var(--accent)}
.watch-info{flex:1;min-width:0}
.watch-sym{font-size:12px;font-weight:700;display:block}
.watch-name{font-family:var(--mono);font-size:9px;color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.watch-prices{text-align:right}
.watch-price{font-family:var(--mono);font-size:12px;font-weight:600;display:block}
.watch-chg{font-family:var(--mono);font-size:10px;display:block;margin-top:1px}
.watch-chg.pos{color:var(--green)}
.watch-chg.neg{color:var(--red)}

/* sectors */
.sector-list{display:flex;flex-direction:column;gap:0}
.sector-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.sector-row:last-child{border-bottom:none}
.sector-name{font-size:11px;font-weight:600}
.sector-bar-wrap{flex:1;height:3px;background:var(--border);border-radius:2px;margin:0 10px}
.sector-bar{height:100%;border-radius:2px;transition:.3s}
.sector-pct{font-family:var(--mono);font-size:10px;font-weight:600;min-width:42px;text-align:right}

/* ─── STOCK BROWSER ─── */
.browser-panel{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-xl);padding:24px;
  margin:0 24px 16px;max-width:1600px;margin-left:auto;margin-right:auto;
}
.browser-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.browser-title{font-size:20px;font-weight:800;letter-spacing:-.02em}
.browser-controls{display:flex;align-items:center;gap:10px}
.market-tabs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px}
.market-tab{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;color:var(--sub);transition:.15s}
.market-tab:hover{color:var(--text)}
.market-tab.active{background:var(--surface3);color:var(--text);border:1px solid var(--border2)}
.sector-filter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.sector-chip{
  padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;
  border:1px solid var(--border);color:var(--sub);background:var(--surface2);transition:.15s;
}
.sector-chip:hover{color:var(--text);border-color:var(--border2)}
.sector-chip.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(74,240,196,.3)}
.stock-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stock-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r-md);padding:14px;cursor:pointer;transition:.2s;
}
.stock-card:hover{border-color:var(--border2);background:var(--surface3);transform:translateY(-1px)}
.stock-card.active{border-color:rgba(74,240,196,.3);background:linear-gradient(135deg,#0d1e18,var(--surface2))}
.stock-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.stock-sym{font-size:13px;font-weight:800;letter-spacing:-.01em}
.stock-name{font-family:var(--mono);font-size:9px;color:var(--sub);margin-top:2px}
.stock-star{font-size:13px;color:var(--dim);transition:.15s}
.stock-star:hover,.stock-star.on{color:var(--accent)}
.stock-price{font-family:var(--mono);font-size:14px;font-weight:600;margin-bottom:2px}
.stock-chg{font-family:var(--mono);font-size:10px;font-weight:600}
.stock-chg.pos{color:var(--green)}
.stock-chg.neg{color:var(--red)}
.stock-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.stock-sector{font-family:var(--mono);font-size:9px;color:var(--dim);background:var(--border);padding:2px 6px;border-radius:4px}
.mini-bars{display:flex;gap:2px;align-items:flex-end;height:16px}
.mini-bar{width:3px;border-radius:2px;background:var(--border)}

/* ─── CALCULATOR ─── */
.calc-panel{
  display:grid;grid-template-columns:1fr 1fr;gap:24px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-xl);padding:24px;
  margin:0 24px 16px;max-width:1600px;margin-left:auto;margin-right:auto;
}
.calc-left{}
.calc-eyebrow{font-family:var(--mono);font-size:9px;color:var(--sub);letter-spacing:.12em;margin-bottom:8px;text-transform:uppercase}
.calc-title{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.calc-desc{font-size:13px;color:var(--sub);line-height:1.6}
.calc-right{display:flex;flex-direction:column;gap:14px}
.form-label{font-family:var(--mono);font-size:9px;color:var(--sub);letter-spacing:.1em;display:block;margin-bottom:5px;text-transform:uppercase}
.budget-row{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 14px;transition:.15s}
.budget-row:focus-within{border-color:rgba(74,240,196,.3)}
.budget-sym{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--sub)}
.budget-row input{flex:1;background:none;border:none;outline:none;font-family:var(--mono);font-size:20px;font-weight:600}
.calc-select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 14px;font-family:var(--mono);font-size:12px;color:var(--text);outline:none;transition:.15s;appearance:none;cursor:pointer}
.calc-select:focus{border-color:rgba(74,240,196,.3)}
.calc-result{background:linear-gradient(135deg,#0d1e18,#0b1410);border:1px solid rgba(74,240,196,.15);border-radius:var(--r-md);padding:16px}
.result-shares-label{font-family:var(--mono);font-size:9px;color:var(--sub);text-transform:uppercase;letter-spacing:.1em}
.result-shares{font-family:var(--mono);font-size:36px;font-weight:600;color:var(--accent);margin:4px 0 12px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid rgba(74,240,196,.1);margin-top:8px}
.result-row span{font-family:var(--mono);font-size:10px;color:var(--sub)}
.result-row strong{font-family:var(--mono);font-size:11px;font-weight:600}
.calc-disclaimer{font-family:var(--mono);font-size:9px;color:var(--dim);line-height:1.5}

/* ─── FOOTER ─── */
footer{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 24px;border-top:1px solid var(--border);
  max-width:1600px;margin:auto;
}
.footer-brand{font-weight:800;font-size:14px;letter-spacing:.04em}
.footer-brand span{color:var(--accent)}
.footer-meta{font-family:var(--mono);font-size:9px;color:var(--dim)}
.footer-status{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;color:var(--sub)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.status-dot.offline{background:var(--red);box-shadow:0 0 8px var(--red)}

/* ─── UTILS ─── */
.pos{color:var(--green)}
.neg{color:var(--red)}
.hidden{display:none}

/* ─── RESPONSIVE ─── */
@media(max-width:1200px){
  .stock-grid{grid-template-columns:repeat(3,1fr)}
  .main-grid{grid-template-columns:1fr}
  .index-strip{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:800px){
  .topbar{flex-wrap:wrap;height:auto;padding:12px 16px;gap:10px}
  .nav{order:3;width:100%;overflow-x:auto;gap:4px;padding-bottom:4px}
  .shell{padding:0 16px}
  .index-strip{grid-template-columns:repeat(2,1fr);padding:14px 16px}
  .main-grid{padding:0 16px 16px}
  .browser-panel,.calc-panel{margin:0 16px 12px}
  .stock-grid{grid-template-columns:repeat(2,1fr)}
  .calc-panel{grid-template-columns:1fr}
  .chart-metrics{gap:14px}
  .metric-value.big{font-size:22px}
}
@media(max-width:480px){
  .index-strip{grid-template-columns:repeat(2,1fr)}
  .stock-grid{grid-template-columns:1fr 1fr}
  .topbar-right{flex-wrap:wrap;gap:8px}
  .period-btn{padding:4px 7px}
  footer{flex-direction:column;gap:8px;text-align:center}
}
</style>
</head>

/* ─── CHARTS ─── */
function miniSparkSVG(change){
  const base=change>=0?[6,10,8,13,16,19]:[19,16,18,12,14,8];
  const pts=base.map((y,i)=>`${i*22},${26-y}`).join(' ');
  const color=change>=0?'#3dd68c':'#f56565';
  return `<svg viewBox="0 0 110 28" preserveAspectRatio="none">
    <defs><linearGradient id="sg${change>0?'p':'n'}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".3"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="0,28 ${pts} 110,28" fill="url(#sg${change>0?'p':'n'})"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>`;
}

function mainChartSVG(index){
  const W=1000,H=300,N=60;
  let vals=[];
  if(index.live?.series?.length){
    vals=index.live.series.map(x=>x.v).filter(Number.isFinite).slice(-N);
  }
  if(!vals.length){
    const base=index[2]*(1-(index[3]/100)*0.5);
    for(let i=0;i<N;i++){
      const wave=Math.sin(i/6+index[2])*.018+Math.sin(i/3)*.006+(i/(N-1)-.5)*index[3]/400;
      vals.push(base*(1+wave+(Math.cos(i*1.9)*.003)));
    }
  }
  const n=vals.length;
  const min=Math.min(...vals)*.9975,max=Math.max(...vals)*1.0025;
  const x=i=>i*(W/(n-1));
  const y=v=>H-20-(v-min)/(max-min)*(H-40);
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const area=`0,${H} ${pts} ${W},${H}`;
  const last=vals.at(-1);
  const isUp=index[3]>=0;
  const clr=isUp?'#4af0c4':'#f56565';
  const gid=isUp?'chartUp':'chartDn';
  const gridLines=[.2,.4,.6,.8].map(r=>{
    const yv=min+(max-min)*(1-r);
    const label=yv.toLocaleString('en-IN',{maximumFractionDigits:0});
    return `<line x1="50" y1="${r*H}" x2="${W}" y2="${r*H}" stroke="#1c2330" stroke-width="1"/>
      <text x="0" y="${r*H+4}" fill="#4a5568" font-size="11" font-family="monospace">${label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${clr}" stop-opacity=".18"/>
        <stop offset="75%" stop-color="${clr}" stop-opacity=".03"/>
        <stop offset="100%" stop-color="${clr}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridLines}
    <polygon points="${area}" fill="url(#${gid})"/>
    <polyline points="${pts}" fill="none" stroke="${clr}" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(n-1)}" cy="${y(last)}" r="5" fill="${clr}" stroke="var(--bg)" stroke-width="2"/>
    <circle cx="${x(n-1)}" cy="${y(last)}" r="9" fill="${clr}" fill-opacity=".15"/>
    <line x1="${x(n-1)}" y1="0" x2="${x(n-1)}" y2="${H}" stroke="${clr}" stroke-dasharray="3 4" stroke-width="1" opacity=".4"/>
  </svg>`;
}

/* ─── SECTOR BAR ─── */
function sectorBars(stocks){
  const map={};
  stocks.forEach(s=>{
    if(!map[s[4]])map[s[4]]={sum:0,count:0};
    map[s[4]].sum+=s[3]; map[s[4]].count++;
  });
  const entries=Object.entries(map).map(([k,v])=>[k,v.sum/v.count]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxAbs=Math.max(...entries.map(e=>Math.abs(e[1])),0.01);
  return entries.map(([k,v])=>{
    const isPos=v>=0;
    const barW=Math.abs(v)/maxAbs*100;
    const clr=isPos?'#3dd68c':'#f56565';
    return `<div class="sector-row">
      <span class="sector-name">${k}</span>
      <div class="sector-bar-wrap"><div class="sector-bar" style="width:${barW}%;background:${clr}"></div></div>
      <span class="sector-pct ${cls(v)}">${pct(v)}</span>
    </div>`;
  }).join('');
}

function bind(){
  // Currency switchers (both topbar and browser tabs)

    activeCurrency=b.dataset.currency;
    selectedStock=markets[activeCurrency].stocks[0];
    activeSector='All'; searchQ='';
    render();
  });
  // Index cards
  document.querySelectorAll('[data-index]').forEach(c=>c.onclick=()=>{
    selectedIndex=indices[Number(c.dataset.index)]; render();
  });
  // Period buttons
  document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{
    period=b.dataset.period; render();
  });
  // Stock cards
  document.querySelectorAll('[data-stock-index]').forEach(c=>c.onclick=e=>{
    if(e.target.closest('[data-star]'))return;
    selectedStock=markets[activeCurrency].stocks[Number(c.dataset.stockIndex)]; render();
  });
  // Sector chips
  document.querySelectorAll('[data-sector]').forEach(b=>b.onclick=()=>{
    activeSector=b.dataset.sector; render();
  });
  // Stars (stock grid)
  document.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const sym=b.dataset.star;
    watchlist=watchlist.includes(sym)?watchlist.filter(x=>x!==sym):[...watchlist,sym];
    localStorage.setItem('fv_watchlist',JSON.stringify(watchlist));
    render();
  });
  // Watchlist click → select stock
  document.querySelectorAll('.watch-row').forEach(r=>r.onclick=e=>{
    if(e.target.closest('[data-star]'))return;
    const sym=r.dataset.stock, market=r.dataset.market;
    if(market){ activeCurrency=market; selectedStock=markets[market].stocks.find(s=>s[0]===sym)||markets[market].stocks[0]; render(); }
  });
  // Search
  const si=document.querySelector('#search-input');
  if(si) si.oninput=e=>{searchQ=e.target.value.toLowerCase();
    const grid=document.querySelector('#stock-grid');
    if(grid){
      const filtered=filteredStocks();
      grid.innerHTML=filtered.length?filtered.map(s=>stockCardHTML(s,markets[activeCurrency].stocks.indexOf(s))).join(''):'<div style="grid-column:1/-1;padding:24px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12px">No results.</div>';
      document.querySelectorAll('[data-stock-index]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-star]'))return;selectedStock=markets[activeCurrency].stocks[Number(c.dataset.stockIndex)];render()});
      document.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{e.stopPropagation();const sym=b.dataset.star;watchlist=watchlist.includes(sym)?watchlist.filter(x=>x!==sym):[...watchlist,sym];localStorage.setItem('fv_watchlist',JSON.stringify(watchlist));render()});
    }
  };
  // Calculator
  const bi=document.querySelector('#budget-input');
  const ss=document.querySelector('#stock-select');
  if(bi) bi.oninput=calculate;
  if(ss) ss.onchange=e=>{selectedStock=markets[activeCurrency].stocks[Number(e.target.value)];calculate()};
}

/* ─── CALCULATE ─── */
function calculate(){
  const bi=document.querySelector('#budget-input');
  const b=Number(bi?.value||0);
  const p=selectedStock[2];
  const n=Math.floor(b/p);
  const cost=n*p;
  const rem=Math.max(0,b-cost);
  const el=id=>document.querySelector('#'+id);
  if(el('result-shares')) el('result-shares').textContent=n.toLocaleString();
  if(el('result-cost')) el('result-cost').textContent=money(cost);
  if(el('result-remaining')) el('result-remaining').textContent=money(rem);
}

/* ─── LIVE DATA ─── */
async function fetchYahoo(symbol,range='1d',interval='5m'){
  try{
    const u=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=${range}&interval=${interval}&includePrePost=false`;
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok)throw 0;
    const j=await r.json();
    const q=j.chart.result?.[0];
    if(!q)throw 0;
    const meta=q.meta||{};
    const ts=q.timestamp||[];
    const closes=q.indicators?.quote?.[0]?.close||[];
    const series=closes.map((v,i)=>v==null?null:{t:ts[i],v}).filter(Boolean);
    const last=meta.regularMarketPrice??series.at(-1)?.v;
    const prev=meta.previousClose??series.at(-2)?.v;
    return{price:last,change:prev&&last!=null?(last-prev)/prev*100:0,
      open:meta.regularMarketOpen,high:meta.regularMarketDayHigh,
      low:meta.regularMarketDayLow,series:series.slice(-78)};
  }catch{return null}
}

async function refreshLive(){
  const tasks=[];
  for(const c of Object.keys(markets))
    for(const s of markets[c].stocks){
      const y=liveSymbols[c][s[0]];
      if(y) tasks.push(fetchYahoo(y).then(d=>{if(d?.price!=null){s[2]=d.price;s[3]=d.change;s.live=d;}}));
    }
  for(const ix of indices){
    const y=liveIndexSymbols[ix[0]];
    if(y) tasks.push(fetchYahoo(y).then(d=>{if(d?.price!=null){ix[2]=d.price;ix[3]=d.change;ix.live=d;}}));
  }
  await Promise.all(tasks);
  liveReady=true; liveUpdatedAt=new Date();
  selectedStock=markets[activeCurrency].stocks.find(s=>s[0]===selectedStock[0])||markets[activeCurrency].stocks[0];
  selectedIndex=indices.find(i=>i[0]===selectedIndex[0])||indices[0];
  render();
}

/* ─── BOOT ─── */
render();
refreshLive();
setInterval(refreshLive,60000);
